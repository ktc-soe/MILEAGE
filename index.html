<!doctype html>
<html lang="rn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#163A2B">
<title>Ministry Questionnaire · Kibidula · OCI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23163A2B'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23C29B3B'/%3E%3C/svg%3E">
<style>
:root{--g:#163A2B;--g2:#1f4f3a;--gold:#C29B3B;--soft:#f3e9cc;--paper:#f6f5ef;--card:#fff;--ink:#1b241e;--muted:#5f6b62;--line:#dfe4da;--tint:#eef2ec;--teal:#2c7a7b;--rose:#b5546b;--err:#b23b3b;--ok:#2f7d4f;--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:40;background:var(--g);color:#fff;border-bottom:3px solid var(--gold);padding:.6rem .9rem .55rem}
.top-in{max-width:640px;margin:0 auto}
.top-r{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.logos{display:flex;align-items:center;gap:.5rem;min-width:0}
.logos span{background:#fff;border-radius:7px;padding:3px 7px;display:flex;align-items:center}
.logos img{height:22px;display:block;width:auto}
.tg{display:flex;background:rgba(255,255,255,.16);border-radius:99px;padding:2px;flex:0 0 auto}
.tg button{border:0;background:transparent;color:#fff;font-weight:700;font-size:.72rem;padding:.3rem .8rem;border-radius:99px;min-height:30px}
.tg button.on{background:var(--gold);color:var(--g)}
.prog{height:6px;background:rgba(255,255,255,.22);border-radius:9px;margin-top:.55rem;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
.pl{display:flex;justify-content:space-between;font-size:.68rem;color:rgba(255,255,255,.85);margin-top:.25rem}
main{max-width:640px;margin:0 auto;padding:1rem .95rem 7rem}
h1{font-size:1.2rem;line-height:1.2;color:var(--g);margin:.2rem 0 .3rem}
h2{font-size:1.05rem;line-height:1.25;color:var(--g);margin:.1rem 0 .15rem}
.sub{font-size:.8rem;color:var(--muted);margin-bottom:.8rem}
.tabs{display:flex;gap:.55rem;margin:.9rem 0 .8rem}
.tab{flex:1;border:2px solid var(--line);background:#fff;border-radius:16px;padding:.8rem .5rem;text-align:center;color:var(--ink)}
.tab .ic{width:38px;height:38px;border-radius:50%;background:var(--tint);margin:0 auto .3rem;display:grid;place-items:center;font-size:1.1rem}
.tab b{display:block;font-size:.9rem;color:var(--g)}.tab span{font-size:.72rem;color:var(--muted)}
.tab.on{border-color:var(--gold);background:var(--soft)}.tab.on .ic{background:var(--g);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
.note{background:var(--soft);border:1px solid #e3d3a2;color:#5e4812;border-radius:14px;padding:.75rem .85rem;font-size:.8rem;margin-bottom:.8rem}
.note p{margin:.15rem 0 .45rem}.note p:last-child{margin-bottom:0}
.lbl{display:block;font-size:.68rem;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin:.1rem 0 .3rem}
.lbl .rq{color:var(--err)}
input[type=text],input[type=date],textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:.65rem .75rem;font:inherit;font-size:.95rem;background:#fbfbf8;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--g);background:#fff;box-shadow:0 0 0 3px rgba(22,58,43,.12)}
.fld{margin-bottom:.7rem}.fld.bad input{border-color:var(--err)}
.err{color:var(--err);font-size:.74rem;margin-top:.25rem;display:none}.fld.bad .err{display:block}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:.45rem .85rem;font-size:.85rem;color:var(--ink);min-height:40px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:.9rem;font-weight:700;font-size:1rem;background:var(--g);color:#fff;text-align:center;min-height:50px}
.btn.gold{background:var(--gold);color:var(--g)}
.btn.ghost{background:#fff;color:var(--g);border:1.5px solid var(--line)}
.btn[disabled],.btn.off{opacity:.45}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);padding:.6rem .95rem calc(.6rem + var(--sab))}
.nav-in{max-width:640px;margin:0 auto;display:flex;gap:.55rem}
.nav .btn.ghost{flex:0 0 36%}.nav .btn{flex:1}
.sec{display:flex;align-items:center;gap:.55rem;margin-bottom:.8rem}
.badge{background:var(--g);color:#fff;font-weight:800;font-size:.8rem;border-radius:9px;padding:.25rem .55rem;flex:0 0 auto}
.qn{display:inline-block;background:var(--g);color:#fff;border-radius:8px;font-size:.75rem;font-weight:800;padding:.1rem .5rem;margin-right:.4rem}
.q{font-size:.95rem;font-weight:600;line-height:1.35;margin:.1rem 0 .5rem}
.qh{font-size:.76rem;color:var(--muted);margin:-.25rem 0 .5rem}
.opt{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:.65rem .75rem;margin-bottom:.4rem;font-size:.9rem;color:var(--ink);min-height:46px}
.opt .bx{width:20px;height:20px;border:2px solid #b9c2b8;border-radius:5px;flex:0 0 auto;position:relative}
.opt.radio .bx{border-radius:50%}
.opt.on{border-color:var(--g);background:var(--tint)}
.opt.on .bx{background:var(--g);border-color:var(--g)}
.opt.on .bx:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt.radio.on .bx:after{left:4px;top:4px;width:6px;height:6px;border:0;background:#fff;border-radius:50%;transform:none}
.row{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.row .opt{width:auto;flex:1 1 auto;justify-content:center;margin:0;text-align:center}
.scale{display:flex;gap:.35rem;margin:.1rem 0 .2rem}
.scale button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:.6rem 0;font-size:.95rem;font-weight:600;color:var(--muted);min-height:46px}
.scale button.on{background:var(--gold);border-color:var(--gold);color:var(--g)}
.sl{display:flex;justify-content:space-between;gap:.5rem;font-size:.68rem;color:var(--muted);margin-bottom:.1rem}
.trow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.7rem;margin-bottom:.55rem}
.trow .tt{font-size:.88rem;font-weight:600;margin-bottom:.4rem;line-height:1.3}
.fu{border-left:3px solid var(--gold);background:var(--soft);border-radius:0 12px 12px 0;padding:.55rem .7rem;margin:.1rem 0 .8rem}
.fu .lbl{color:#7a5d17;text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:600}
.fu textarea{background:#fff}
.item{margin-bottom:1.15rem}
.hint{font-size:.76rem;color:var(--rose);margin:-.2rem 0 .45rem;min-height:1em}
.hint.muted{color:var(--muted)}
.rk{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:.55rem .7rem;margin-bottom:.4rem;font-size:.88rem;color:var(--ink);min-height:48px;line-height:1.25}
.rk .n{width:28px;height:28px;border-radius:50%;border:2px dashed #b9c2b8;flex:0 0 auto;display:grid;place-items:center;font-size:.85rem;font-weight:800;color:#fff}
.rk.on{border-color:var(--gold);background:var(--soft)}.rk.on .n{background:var(--g);border:0}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.done{text-align:center;padding-top:1.5rem}
.okc{width:76px;height:76px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:2.4rem;margin:0 auto 1rem;box-shadow:0 0 0 8px var(--soft)}
.queued{background:#fff3cd;border:1px solid #ecd58a;color:#6b5410;border-radius:12px;padding:.6rem .75rem;font-size:.8rem;margin:.8rem 0;text-align:left}
footer{max-width:640px;margin:0 auto;padding:0 .95rem 5.5rem;text-align:center;font-size:.72rem;color:var(--muted)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.72rem;padding:.5rem}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:.6rem .9rem;font-size:.82rem;z-index:300;max-width:90vw;display:none;text-align:center}
.toast.err{background:var(--err)}
/* ---- admin ---- */
.ov{position:fixed;inset:0;z-index:200;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch}
.ov-in{max-width:820px;margin:0 auto;padding:0 .95rem 3rem}
.ov-top{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;border-bottom:3px solid var(--gold);padding:.6rem .95rem}
.ov-top .in{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.ov-top b{font-size:.95rem}
.xbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:.45rem .8rem;font-weight:700;font-size:.8rem;min-height:36px}
.tb2{display:flex;background:var(--tint);border-radius:13px;padding:3px;margin:.9rem 0 .7rem}
.tb2 button{flex:1;border:0;background:transparent;padding:.6rem 0;border-radius:10px;font-weight:700;font-size:.85rem;color:var(--muted)}
.tb2 button.on{background:var(--g);color:#fff}
.tools{display:flex;gap:.5rem;margin-bottom:.8rem}
.tools select{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:.55rem .6rem;font:inherit;font-size:.85rem;background:#fff;min-width:0}
.tools button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:.55rem .8rem;font-weight:700;font-size:.82rem;color:var(--g);white-space:nowrap}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-bottom:.8rem}
@media(min-width:560px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.65rem .7rem}
.kp b{display:block;font-size:1.45rem;color:var(--g);line-height:1.1}.kp span{font-size:.7rem;color:var(--muted)}
.ch{background:#fff;border:1px solid var(--line);border-radius:14px;padding:.75rem .8rem;margin-bottom:.7rem}
.ch h3{margin:0 0 .5rem;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 38px;align-items:center;gap:.5rem;font-size:.78rem;margin:.32rem 0}
.bar .tr{background:var(--tint);border-radius:6px;height:13px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:6px}
.bar em{font-style:normal;color:var(--muted);font-size:.72rem;text-align:right}
.resp{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:13px;padding:.6rem .75rem;margin-bottom:.45rem;font-size:.82rem;line-height:1.35;color:var(--ink)}
.resp b{color:var(--g)}.resp i{font-style:normal;color:var(--muted)}
.dq{border-top:1px solid var(--line);padding:.5rem 0;font-size:.85rem}.dq .k{font-size:.74rem;color:var(--muted)}.dq .v{white-space:pre-wrap;word-break:break-word}
.mod{position:fixed;inset:0;z-index:260;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center}
.mod-in{background:var(--paper);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:1rem .95rem 1.4rem}
.pw{max-width:360px;margin:5rem auto;padding:0 1rem}
</style>
</head>

/* every sheet column id for a questionnaire, in order */
function colsFor(type){
  const S=SCHEMA[type],out=[];
  S.ident.forEach(f=>out.push(f.id));
  S.sections.forEach(sec=>sec.items.forEach(it=>{
    if(it.type==="table"){it.rows.forEach(r=>{out.push(r.id);if(r.text)out.push(r.text);});}
    else if(it.type==="three"){it.fields.forEach(f=>out.push(f.id));}
    else if(it.type==="rank"){it.opts.forEach(o=>{out.push(it.id+"_"+o.v);if(o.text)out.push(it.id+"_other_text");});}
    else{out.push(it.id);(it.opts||[]).forEach(o=>{if(o.text)out.push(o.text);});}
    if(it.follow)out.push(it.follow.id);
  }));
  return out;
}
if(typeof module!=="undefined")module.exports={SCHEMA,colsFor};

    if(it.exclusive&&v===it.exclusive)a=[v];

      a.push(v);}
  }
  S.A[itemId]=a;save();keepScroll(render);
}

/* ---------- submit ---------- */
function flatten(){
  const sc=SCHEMA[S.type],A=S.A,out={};
  colsFor(S.type).forEach(c=>{const v=A[c];if(Array.isArray(v))out[c]=v.join(";");else out[c]=v==null?"":String(v);});
  sc.sections.forEach(s=>s.items.forEach(it=>{
    if(it.type==="rank"){const rk=A[it.id+"_rank"]||[];it.opts.forEach(o=>{const i=rk.indexOf(o.v);out[it.id+"_"+o.v]=i>=0?String(i+1):"";});}
    if(it.follow&&!(it.follow.when||[]).includes(String(A[it.id]||"")))out[it.follow.id]="";
  }));
  return out;
}
async function post(body){
  const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return await r.json();
}
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]");}catch(e){return[];}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q));}catch(e){}}
async function flushQueue(){
  if(!SCRIPT_URL||/PASTE/.test(SCRIPT_URL))return;
  let q=getQ();if(!q.length)return;
  const rest=[];
  for(const p of q){try{const r=await post(p);if(!(r&&r.ok)&&!(r&&/Missing|Bad id|Unknown/.test(r.error||"")))rest.push(p);}catch(e){rest.push(p);}}
  setQ(rest);
}
async function doSubmit(){
  if(BUSY)return;
  const sc=SCHEMA[S.type],sec=sc.sections[sc.sections.length-1];
  if(rankIncomplete(sec)){const h=document.querySelector('[id^="h_"]');if(h){h.classList.add("shake");setTimeout(()=>h.classList.remove("shake"),400);}toast(u("rankall"),true);return;}
  if(!SCRIPT_URL||/PASTE/.test(SCRIPT_URL)){toast(u("notset"),true);return;}
  BUSY=true;const btn=$("nextBtn");if(btn){btn.textContent=u("sending");btn.disabled=true;}
  const payload={action:"submit",type:S.type,lang:S.lang,id:S.id,answers:flatten()};
  try{
    const r=await post(payload);
    if(r&&r.ok){finish(false);}
    else{toast((r&&r.error)||u("neterr"),true);}
  }catch(e){
    const q=getQ();q.push(payload);setQ(q);finish(true);
  }
  BUSY=false;if(btn){btn.disabled=false;}
}
function finish(queued){
  S.done=true;S.queuedNote=!!queued;
  try{localStorage.removeItem(KEY);}catch(e){}
  render();window.scrollTo(0,0);
}
function renderDone(){
  const sc=SCHEMA[S.type];
  $("app").innerHTML='<div class="done"><div class="okc">✓</div><h1>'+esc(S.lang==="en"?"Thank you!":"Murakoze!")+'</h1><div class="sub">'+esc(t(sc.thanks))+"</div>"+(S.queuedNote?'<div class="queued">'+esc(u("saved"))+"</div>":"")+"</div>";
  $("navHost").innerHTML='<div class="nav"><div class="nav-in"><button class="btn gold" onclick="another()">'+esc(u("another"))+"</button></div></div>";
}
function another(){
  const keep={church:S.A.church||""};
  S.A=keep;if(S.type==="pastor")S.A.date=today();
  S.step=0;S.done=false;S.queuedNote=false;S.id=newId();save();render();window.scrollTo(0,0);
}

function render(){
  paintTg();
  const sc=SCHEMA[S.type];
  const inForm=!S.done&&S.step>0;
  $("progWrap").style.display=inForm?"block":"none";
  document.querySelector("footer").style.display=inForm?"none":"block";
  if(inForm){const sec=sc.sections[S.step-1];$("progBar").style.width=Math.round(S.step/sc.sections.length*100)+"%";$("progL").textContent=sec.id+" · "+t(sec.t);$("progR").textContent=S.step+" / "+sc.sections.length;}
  if(S.done)renderDone();else if(S.step===0)renderLanding();else renderSection();
}

  if(it.type==="scale"){return (r[id]?r[id]+" / 5":"")+(it.follow&&r[it.follow.id]?"\n→ "+r[it.follow.id]:"");}
  if(it.type==="table"){return it.rows.map(x=>t(x)+": "+(r[x.id]||"–")+(x.text&&r[x.text]?" ("+r[x.text]+")":"")).join("\n");}
  if(it.type==="three"){return it.fields.map(f=>t(f)+": "+(r[f.id]||"–")).join("\n");}
  if(it.type==="rank"){const a=it.opts.map(o=>({o,n:Number(r[id+"_"+o.v])||0})).filter(x=>x.n).sort((x,y)=>x.n-y.n);return a.map(x=>x.n+". "+t(x.o)+(x.o.text&&r[id+"_other_text"]?" ("+r[id+"_other_text"]+")":"")).join("\n");}
  return r[id]||"";
}
function showResp(id){
  const r=(AD.rows[AD.tab]||[]).find(x=>x.id===id);if(!r)return;
  const sc=SCHEMA[AD.tab];
  let h='<div class="dq" style="border:0"><b>'+esc(r.church||"")+"</b> · "+esc(r.name||"—")+'<div class="k">'+esc(String(r.ts||"").slice(0,16).replace("T"," "))+" · "+esc(u("lang"))+": "+esc((r.lang||"").toUpperCase())+(r.age?" · "+esc(optLabel(sc.ident.find(f=>f.id==="age"),r.age)):"")+(r.years?" · "+esc(r.years):"")+"</div></div>";
  sc.sections.forEach(s=>{h+='<div class="dq"><b style="color:var(--g)">'+s.id+" · "+esc(t(s.t))+"</b></div>";s.items.forEach(it=>{const v=valText(it,r);h+='<div class="dq"><div class="k">'+it.n+". "+esc(t(it.q))+'</div><div class="v">'+(v?esc(v):"—")+"</div></div>";});});
  h+='<div style="height:.8rem"></div><button class="btn ghost" onclick="closeMod()">'+esc(u("close"))+'</button><div style="height:.4rem"></div><button class="btn" style="background:var(--err)" onclick="delResp(\''+esc(r.id)+'\')">'+esc(u("del"))+"</button>";
  $("modHost").innerHTML='<div class="mod" onclick="if(event.target===this)closeMod()"><div class="mod-in">'+h+"</div></div>";
}
function closeMod(){$("modHost").innerHTML="";}
async function delResp(id){
  if(!confirm(u("delq")))return;
  try{const r=await post({action:"delete",pass:AD.pass,type:AD.tab,id});
    if(r&&r.ok){AD.rows[AD.tab]=AD.rows[AD.tab].filter(x=>x.id!==id);closeMod();renderAdmin();}else toast((r&&r.error)||u("neterr"),true);}
  catch(e){toast(u("neterr"),true);}
}
/* ---- CSV ---- */
function csvCell(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function exportCsv(){
  const rows=admRows(),sc=SCHEMA[AD.tab],cols=colsFor(AD.tab);
  const meta={};sc.ident.forEach(f=>meta[f.id]={it:f});
  sc.sections.forEach(s=>s.items.forEach(it=>{
    if(it.type==="table")it.rows.forEach(r=>meta[r.id]={q:it.n+" · "+t(r)});
    else if(it.type==="three")it.fields.forEach(f=>meta[f.id]={q:it.n+" · "+t(f)});
    else if(it.type==="rank"){it.opts.forEach(o=>meta[it.id+"_"+o.v]={q:it.n+" · "+t(o)});meta[it.id+"_other_text"]={q:it.n+" · "+(S.lang==="en"?"Other (text)":"Ikindi (inyandiko)")};}
    else{meta[it.id]={it,q:it.n+" · "+t(it.q)};(it.opts||[]).forEach(o=>{if(o.text)meta[o.text]={q:it.n+" · "+(S.lang==="en"?"Other (text)":"Ikindi (inyandiko)")};});}
    if(it.follow)meta[it.follow.id]={q:it.n+" · "+t(it.follow.label)};
  }));
  const head=["Date","ID","Lang"].concat(cols.map(c=>{const m=meta[c];return m&&m.q?m.q:(m&&m.it&&m.it.label?t(m.it.label):c);}));
  const lines=[head.map(csvCell).join(",")];
  rows.forEach(r=>{
    const row=[r.ts,r.id,r.lang];
    cols.forEach(c=>{const m=meta[c];let v=r[c]||"";
      if(m&&m.it&&m.it.opts&&v){if(m.it.type==="multi")v=String(v).split(";").map(x=>optLabel(m.it,x)).join("; ");else v=optLabel(m.it,v);}
      row.push(v);});
    lines.push(row.map(csvCell).join(","));
  });
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ministry-"+AD.tab+"-"+today()+".csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- start ---------- */
load();
if(S.type==="pastor"&&!S.A.date)S.A.date=today();
document.documentElement.lang=S.lang==="en"?"en":"rn";
render();
flushQueue();
window.addEventListener("online",flushQueue);
</script>
